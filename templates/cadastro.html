<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANTAR - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        :root { --primary:#2e7d32; --bg:#f5f6fa; }
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-card { background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); padding:40px; width:100%; max-width:420px; }
        .login-brand { text-align:center; font-size:1.4rem; font-weight:800; color:#1a2332; margin-bottom:8px; }
        .login-brand i { color:var(--primary); margin-right:6px; }
        .login-sub { text-align:center; font-size:.85rem; color:#888; margin-bottom:20px; }
        .btn-primary { background:var(--primary); border:none; }
        .btn-primary:hover { background:#256428; }
        .login-links { text-align:center; margin-top:16px; font-size:.88rem; }
        .login-links a { color:var(--primary); text-decoration:none; }

        .tipo-tabs { display:flex; gap:4px; background:var(--bg); border-radius:10px; padding:4px; margin-bottom:24px; }
        .tipo-tab { flex:1; text-align:center; padding:9px 6px; border-radius:7px; font-weight:600; font-size:.85rem; color:#666; cursor:pointer; user-select:none; transition:.2s; }
        .tipo-tab.active { background:var(--primary); color:#fff; }

        .campos-cooperado, .campos-cooperativa { display:none; }
        .campos-cooperado.active, .campos-cooperativa.active { display:block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand"><i class="bi bi-flower2"></i> PLANTAR</div>
        <div class="login-sub">Criar conta</div>

        <div class="tipo-tabs">
            <div class="tipo-tab active" id="tab-cooperado" onclick="selecionarTipo('cooperado')">
                <i class="bi bi-person"></i> Sou Cooperado
            </div>
            <div class="tipo-tab" id="tab-cooperativa" onclick="selecionarTipo('cooperativa')">
                <i class="bi bi-building"></i> Sou Cooperativa
            </div>
        </div>

        {% if erro %}
        <div class="alert alert-danger py-2">{{ erro }}</div>
        {% endif %}

        {% if sucesso %}
        <div class="alert alert-success py-2">{{ sucesso }}</div>
        {% else %}
        <form method="POST">
            <input type="hidden" name="tipo" id="input-tipo" value="cooperado">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" required minlength="6">
            </div>

            <div class="campos-cooperado active">
                <div class="mb-3">
                    <label class="form-label">CPF ou CNPJ (o mesmo cadastrado na cooperativa)</label>
                    <input type="text" name="cpf_cnpj" class="form-control" placeholder="000.000.000-00">
                </div>
            </div>

            <div class="campos-cooperativa">
                <div class="mb-3">
                    <label class="form-label">Código de acesso da cooperativa</label>
                    <input type="text" name="codigo_acesso" class="form-control" placeholder="Fornecido pela equipe">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>
        {% endif %}

        <div class="login-links">
            Já tem conta? <a href="{{ url_for('login') }}">Fazer login</a>
        </div>
    </div>

    <script>
        function selecionarTipo(tipo) {
            document.getElementById('input-tipo').value = tipo;

            document.getElementById('tab-cooperado').classList.toggle('active', tipo === 'cooperado');
            document.getElementById('tab-cooperativa').classList.toggle('active', tipo === 'cooperativa');

            document.querySelector('.campos-cooperado').classList.toggle('active', tipo === 'cooperado');
            document.querySelector('.campos-cooperativa').classList.toggle('active', tipo === 'cooperativa');

            // torna obrigatório só o campo do tipo selecionado
            document.querySelector('[name="cpf_cnpj"]').required = (tipo === 'cooperado');
            document.querySelector('[name="codigo_acesso"]').required = (tipo === 'cooperativa');
        }
        // estado inicial
        selecionarTipo('cooperado');
    </script>
</body>
</html>
