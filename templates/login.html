<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANTAR - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        :root { --primary:#2e7d32; --bg:#f5f6fa; }
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-card { background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); padding:40px; width:100%; max-width:380px; }
        .login-brand { text-align:center; font-size:1.4rem; font-weight:800; color:#1a2332; margin-bottom:24px; }
        .login-brand i { color:var(--primary); margin-right:6px; }
        .btn-primary { background:var(--primary); border:none; }
        .btn-primary:hover { background:#256428; }
        .login-links { text-align:center; margin-top:16px; font-size:.88rem; }
        .login-links a { color:var(--primary); text-decoration:none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand"><i class="bi bi-flower2"></i> PLANTAR</div>

        {% if erro %}
        <div class="alert alert-danger py-2">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <div class="login-links">
            Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
